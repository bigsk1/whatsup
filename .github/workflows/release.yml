name: Unsigned preview release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unsigned-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Preview package (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32-x64
          - os: ubuntu-24.04
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Verify clean matching version tag
        id: context
        run: node scripts/whatsup.mjs release-preflight
      - name: Disable Go telemetry
        run: go telemetry off
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev build-essential pkg-config
      - name: Install frozen graph and pinned packaging tools
        run: npm run setup
      - name: Install browser system dependencies
        if: runner.os == 'Linux'
        run: node frontend/node_modules/@playwright/test/cli.js install-deps chromium
      - name: Test, check and package unsigned preview
        run: npm run package
      - name: Preserve platform package, checksums, SBOM and manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.platform }}
          path: artifacts/${{ steps.context.outputs.version }}/${{ matrix.platform }}/*
          if-no-files-found: error
          retention-days: 14

  assemble:
    name: Verify complete release bundle
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      bundle-id: ${{ steps.bundle.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*-x64'
          path: artifacts/release-input
      - name: Verify both source-bound packages and consolidate checksums
        run: node scripts/whatsup.mjs release-collect
      - id: bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 14

  attest:
    name: Attest verified preview bundle
    needs: assemble
    runs-on: ubuntu-24.04
    # GitHub scopes these permissions to jobs, not steps. No checkout, package
    # scripts or repository code executes in this narrowly scoped job.
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.assemble.outputs.bundle-id }}
          path: verified-bundle
          merge-multiple: true
      - name: Generate GitHub build-provenance attestations
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: verified-bundle/*

  release:
    name: Publish release
    needs: [assemble, attest]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.assemble.outputs.bundle-id }}
          path: artifacts/release
          merge-multiple: true
      - name: Publish verified files with changelog notes
        run: node scripts/whatsup.mjs release-publish
        env:
          GH_TOKEN: ${{ github.token }}

# Existing releases are never overwritten, and no in-app update path exists.
# Delete a failed release deliberately before rerunning its tag.
