# Retained native packaging metadata. Packaging stays blocked until reviewed
# installer tools, owner identity, notices/SBOM and signing are configured.
name: whatsup
arch: ${GOARCH}
platform: linux
version: 0.0.3
section: net
priority: optional
description: Private one-to-one desktop messenger
# No public license or publisher has been selected.
license: UNLICENSED
contents:
  - src: ./build/bin/whatsup
    dst: /usr/bin/whatsup
  - src: ./build/appicon.png
    dst: /usr/share/icons/hicolor/128x128/apps/whatsup.png
  - src: ./build/linux/desktop
    dst: /usr/share/applications/whatsup.desktop
depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4
overrides:
  rpm:
    depends: [gtk4, webkitgtk6.0]
scripts:
  postinstall: ./build/linux/nfpm/scripts/postinstall.sh
