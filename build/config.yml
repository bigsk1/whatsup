version: '3'

# Development metadata only. No publisher, public license, or signing identity
# has been selected. Regenerating upstream build assets would overwrite reviewed
# recipes and must be treated as a deliberate source change.
info:
  companyName: ''
  productName: WhatsUp
  productIdentifier: local.whatsup.desktop
  description: Private one-to-one desktop messenger
  copyright: ''
  comments: Unsigned development candidate
  version: 0.0.3

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir: [.git, .local, node_modules, frontend, build, artifacts]
    file: [.gitignore, '*_test.go', '*.syso']
    watched_extension: ['*.go']
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary
      exit_policy: shutdown

fileAssociations: []
