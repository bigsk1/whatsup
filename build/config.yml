version: '3'

# Preview metadata: MIT, copyright bigsk1. Authenticode is not configured.
# Regenerating upstream build assets would overwrite reviewed recipes; review
# that as a deliberate source change.
info:
  companyName: bigsk1
  productName: WhatsUp
  productIdentifier: local.whatsup.desktop
  description: Private one-to-one desktop messenger
  copyright: Copyright (c) 2026 bigsk1
  comments: Not code-signed
  version: 0.2.0

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir: [.git, .local, node_modules, frontend, build, artifacts]
    file: [.gitignore, '*_test.go', '*.syso']
    watched_extension: ['*.go']
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary
      exit_policy: shutdown

fileAssociations: []
